<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UIAU — User Interface of Aphonic Utterance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root { --bg: #f8f8f8; --ink: #181818; --mute: #8a8a8a; --line: #e4e4e4; --white: #ffffff; --acc: #33b3dd; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Inter", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--ink); letter-spacing: .02em; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }

  /* 1画面・中央1列 */
  .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  header { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 18px clamp(20px, 4vw, 48px); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .brand-t { line-height: 1.2; }
  .brand-t b { display: block; font-size: 19px; font-weight: 700; letter-spacing: .14em; }
  .brand-t span { font-size: 11px; letter-spacing: .04em; }
  .menu { width: 40px; height: 40px; display: grid; place-items: center; }
  .menu span, .menu span::before, .menu span::after { display: block; width: 24px; height: 2px; background: var(--ink); position: relative; content: ""; }
  .menu span::before { position: absolute; top: -8px; } .menu span::after { position: absolute; top: 8px; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 620px) minmax(0, 1fr); gap: clamp(14px, 2.4vw, 40px); padding: 0 clamp(20px, 4vw, 48px); }
  main > * { min-width: 0; }
  .center { min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 2.2vh, 22px); }
  .hist-col, .side-col { min-height: 0; display: flex; flex-direction: column; padding: 6px 0 4px; }
  /* 履歴: 新しいものが下。古いものは上へ押し上げられる */
  .hist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none; }
  .hist > :first-child { margin-top: auto; }
  .hb { align-self: flex-start; max-width: 100%; background: var(--white); border-radius: 20px 20px 20px 4px; padding: 10px 16px 8px; margin-top: 8px; font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 15px; line-height: 1.5; word-break: break-all; }
  .hb time { display: block; font-family: "Inter", sans-serif; font-size: 10px; font-weight: 400; color: var(--mute); letter-spacing: .06em; }
  .side { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .sec { margin: 14px 0 8px; }
  .empty { font-family: "Noto Sans JP", sans-serif; font-size: 13px; color: var(--mute); line-height: 1.9; margin-top: 12px; }
  .empty.small { font-size: 12px; margin-top: 6px; }
  .cand { display: block; width: 100%; text-align: left; border-radius: 16px; padding: 10px 16px; margin-bottom: 6px; background: var(--white); font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 15px; line-height: 1.5; word-break: break-all; }
  .cand:hover { background: var(--ink); color: var(--bg); }
  .cand.sent { font-size: 16px; padding: 12px 16px; }
  .cand small { margin-left: 10px; font-family: "Inter", "Noto Sans JP", sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--acc); }
  .cand.word { display: inline-block; width: auto; border-radius: 9999px; margin-right: 6px; padding: 8px 16px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .16em; white-space: nowrap; }
  .label small { font-size: 11px; font-weight: 400; color: var(--mute); margin-left: 8px; letter-spacing: .04em; font-family: "Noto Sans JP", sans-serif; }
  .target { min-height: 20px; font-size: 14px; text-align: center; font-family: "Noto Sans JP", sans-serif; }
  .target b { color: var(--acc); font-size: 17px; }

  /* 自分の吹き出し（1つだけ） */
  .bubble { position: relative; width: 100%; background: var(--white); border-radius: 40px; padding: clamp(18px, 3.4vh, 34px) 56px clamp(18px, 3.4vh, 34px) 40px; min-height: clamp(100px, 18vh, 170px); display: flex; flex-direction: column; justify-content: center; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -11px; width: 24px; height: 24px; background: var(--white); transform: translateX(-50%) rotate(45deg); border-radius: 0 0 6px 0; }
  .bubble .label { position: absolute; top: 18px; left: 40px; }
  .text { font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: clamp(30px, min(6.4vw, 7vh), 56px); letter-spacing: .06em; line-height: 1.3; word-break: break-all; margin-top: 14px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .caret { display: inline-block; width: .06em; min-width: 3px; height: .95em; background: var(--acc); vertical-align: -.08em; margin-left: .06em; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .clear { position: absolute; right: 16px; top: 14px; width: 32px; height: 32px; border-radius: 50%; background: var(--bg); color: var(--ink); display: none; place-items: center; }
  .send { position: absolute; right: 16px; bottom: 14px; width: 40px; height: 40px; border-radius: 50%; background: var(--acc); color: #fff; display: none; place-items: center; }
  .send svg { width: 18px; height: 18px; }
  .bubble.has .send { display: grid; }
  #pend { color: var(--acc); }
  .bubble.long .text { font-size: clamp(20px, min(3.4vw, 4.4vh), 32px); -webkit-line-clamp: 3; }
  .clear svg { width: 16px; height: 16px; }
  .bubble.has .clear { display: grid; }

  /* 口元（小さめ・まわりのリングが進み具合） */
  .mouth-wrap { position: relative; flex: none; width: clamp(210px, min(28vw, 50vh), 260px); aspect-ratio: 2 / 1; margin-top: 6px; }
  .mouth { position: absolute; inset: 0; border-radius: 9999px; overflow: hidden; background: #2b2b2b; }
  .mouth canvas { width: 100%; height: 100%; display: block; }
  .ring { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); pointer-events: none; overflow: visible; }
  .ring rect { fill: none; stroke-width: 4; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .ring .bg { stroke: var(--line); }
  .ring .fg { stroke: var(--ink); transition: stroke .15s; }
  .ring.empty .fg { opacity: 0; }
  .ring.armed .fg { stroke: var(--acc); }
  .mouth-wrap.rec .ring .bg { stroke: var(--acc); }
  .start { position: absolute; inset: 0; display: grid; place-items: center; }
  .pill { background: var(--white); color: var(--ink); border-radius: 9999px; padding: 10px 12px 10px 20px; font-weight: 700; font-size: 14px; font-family: "Noto Sans JP", sans-serif; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
  .pill i { width: 24px; height: 24px; border-radius: 50%; background: var(--acc); display: grid; place-items: center; font-style: normal; color: #fff; }
  .pill:disabled { opacity: .6; }

  .state { text-align: center; }
  .now { font-family: "Noto Sans JP", sans-serif; font-size: clamp(26px, 4.5vh, 38px); font-weight: 700; line-height: 1.1; min-height: 1.1em; }
  .mouth-wrap.armed ~ .state .now { color: var(--acc); }
  .hint { font-size: 13px; margin-top: 4px; font-family: "Noto Sans JP", sans-serif; }
  .hold { display: inline-flex; align-items: center; gap: 12px; padding: 8px 20px 8px 8px; border-radius: 9999px; background: var(--white); font-family: "Noto Sans JP", sans-serif; font-size: 14px; font-weight: 700; user-select: none; -webkit-user-select: none; touch-action: none; transition: background .1s, color .1s; }
  .hold kbd { font-family: "Inter", sans-serif; font-size: 11px; letter-spacing: .12em; background: var(--bg); border-radius: 9999px; padding: 8px 14px; }
  .hold.on { background: var(--acc); color: #fff; }
  .hold.on kbd { background: rgba(255,255,255,.25); }

  footer { flex: none; display: flex; justify-content: space-between; padding: 10px clamp(20px, 4vw, 48px) 16px; font-size: 11px; color: var(--mute); letter-spacing: .1em; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; gap: 8px; }
    .hist-col { max-height: 13vh; } .hist-col > .label, .side-col > .label, .sec { display: none; }
    .side-col { max-height: 92px; overflow: hidden; }
    .side { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; align-items: flex-start; }
    .cand, .cand.word { flex: none; width: auto; white-space: nowrap; margin: 0; }
    .empty { margin-top: 0; }
    .bubble { padding-left: 26px; padding-right: 60px; border-radius: 32px; }
    .bubble .label { left: 26px; }
  }

  /* 口形の登録 */
  .veil { position: fixed; inset: 0; z-index: 20; display: none; background: var(--bg); align-items: center; justify-content: center; padding: 20px; }
  .veil.on { display: flex; }
  .card { width: min(620px, 100%); max-height: 100%; overflow: auto; text-align: center; }
  .big { font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: clamp(72px, 16vh, 140px); line-height: 1; margin: 10px 0 8px; }
  .msg { font-family: "Noto Sans JP", sans-serif; font-size: 16px; font-weight: 500; }
  .sub { font-size: 13px; color: var(--mute); margin-top: 8px; font-family: "Noto Sans JP", sans-serif; line-height: 1.8; }
  .bar { height: 4px; background: var(--line); margin: 18px auto; max-width: 360px; }
  .bar > div { height: 100%; width: 0; background: var(--acc); }
  .card .mouth-wrap { margin: 16px auto 6px; }
  .card h2 { font-family: "Noto Sans JP", sans-serif; font-size: clamp(24px, 4vw, 34px); margin: 10px 0 4px; }
  .scores { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 20px 0 10px; }
  .score { background: var(--white); border-radius: 12px; padding: 14px 6px 12px; text-align: center; border: 2px solid transparent; }
  .score .k { display: block; font-family: "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 700; }
  .score b { display: block; font-size: clamp(22px, 3vw, 30px); font-weight: 700; margin-top: 4px; }
  .score b small { font-size: 12px; font-weight: 500; color: var(--mute); margin-left: 2px; }
  .score.bad { border-color: var(--acc); cursor: pointer; }
  .score.bad b { color: var(--acc); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
  .pill.dark { background: var(--ink); color: var(--bg); }
  .pill.line { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink); padding-right: 20px; }
  @media (max-width: 600px) { .scores { grid-template-columns: repeat(3, 1fr); } }

  /* 設定（右から出るメニュー） */
  .drawer { position: fixed; inset: 0 0 0 auto; width: min(420px, 100vw); background: var(--white); z-index: 30; transform: translateX(100%); transition: transform .25s ease; padding: 22px 32px; overflow: auto; visibility: hidden; }
  .drawer.on { transform: none; visibility: visible; box-shadow: -10px 0 40px rgba(0,0,0,.08); }
  .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(24,24,24,.25); display: none; }
  .scrim.on { display: block; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .x { width: 40px; height: 40px; font-size: 22px; }
  .field { margin: 16px 0; }
  .field label { display: block; font-size: 13px; font-family: "Noto Sans JP", sans-serif; margin-bottom: 8px; }
  .field input[type=number], .field input[type=password], .field input[type=text] { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font: inherit; color: var(--ink); }
  .links { margin-top: 22px; border-top: 1px solid var(--line); }
  .links button { width: 100%; text-align: left; padding: 18px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 15px; }
  .links button span { font-family: "Inter", sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--mute); }
  .note { font-size: 12px; color: var(--mute); margin-top: 14px; font-family: "Noto Sans JP", sans-serif; line-height: 1.8; }

  video#video { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="mark">U</div><div class="brand-t"><b>UIAU</b><span>User Interface of Aphonic Utterance</span></div></div>
    <button class="menu" id="openSettings" aria-label="設定"><span></span></button>
  </header>

  <main>
    <aside class="hist-col">
      <div class="label">HISTORY<small>履歴</small></div>
      <div class="hist" id="hist"></div>
    </aside>

    <div class="center">
      <div class="target" id="target"></div>

      <div class="bubble" id="inputArea">
        <div class="label">INPUT<small>入力</small></div>
        <div class="text"><span id="typed"></span><span id="pend"></span><span class="caret"></span></div>
        <button class="clear" id="clear" aria-label="全部けす" title="全部けす（Backspace）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <button class="send" id="send" aria-label="送る" title="送る（Enter）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>

      <div class="mouth-wrap" id="panel">
        <div class="mouth"><canvas id="mouthCanvas" width="480" height="240"></canvas></div>
        <svg class="ring empty" id="ring" viewBox="0 0 274 144" preserveAspectRatio="none"><rect class="bg" x="2" y="2" width="270" height="140" rx="70"/><rect class="fg" id="ringFg" x="2" y="2" width="270" height="140" rx="70" pathLength="100" stroke-dasharray="0 100"/></svg>
        <div class="start" id="startBox"><button class="pill" id="startCam">カメラをはじめる<i>→</i></button></div>
      </div>

      <div class="state">
        <div class="now" id="now"></div>
        <div class="hint" id="hint"></div>
      </div>

      <button class="hold" id="holdBtn"><kbd>SPACE</kbd>押している間だけ入力</button>
    </div>

    <aside class="side-col">
      <div class="label">CANDIDATES<small>候補</small></div>
      <div class="side" id="cands"></div>
    </aside>
  </main>

  <footer><span>STEP 3 — WORDS &amp; SENTENCES　<span id="dictFoot"></span></span><span>Enter で送る　Backspace で全部けす</span></footer>
</div>

<div class="veil" id="calibVeil">
  <div class="card">
    <div id="calibRun">
      <div class="label">CALIBRATION<small id="calibStep"></small></div>
      <div class="big" id="calibChar">あ</div>
      <div class="msg" id="calibMsg"></div>
      <div class="bar"><div id="calibBar"></div></div>
      <div class="mouth-wrap"><div class="mouth"><canvas id="calibCanvas" width="480" height="240"></canvas></div></div>
      <div class="sub">声は出さず、使うときと同じ口パクで。</div>
    </div>
    <div id="calibDone" style="display:none">
      <div class="label">RESULT<small>登録結果</small></div>
      <h2>登録できました</h2>
      <div class="sub">登録した口形で判定したときの正答率です（周ごとの交差検証）。青い母音は押すと撮り直せます。</div>
      <div class="scores" id="scores"></div>
      <div class="sub" id="calibAdvice"></div>
      <div class="row">
        <button class="pill line" id="calibAgain">ぜんぶ撮り直す</button>
        <button class="pill dark" id="calibOk">はじめる<i>→</i></button>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="settingsVeil">
  <div class="drawer-head"><div class="label">SETTINGS<small>設定</small></div><button class="x" id="closeSettings" aria-label="閉じる">×</button></div>
  <div class="field"><label for="gkey">AIで文を推定: Gemini APIキー</label><input id="gkey" type="password" autocomplete="off" placeholder="空欄なら辞書の候補だけ"><div class="note" style="margin-top:4px">無料枠では送った内容がGoogleの改善に使われます。送るのは母音の並び・長さと、これまでに確定した文です。</div></div>
  <div class="field"><label for="gmodel">AIのモデル（左から順に試す。カンマ区切り）</label><input id="gmodel" type="text" value="gemini-3.8-flash, gemini-3.5-flash-lite, gemini-2.5-flash"></div>
  <div class="note" id="dictNote"></div>
  <div class="field"><label for="segMs">【スペース押下中】同じ母音が何ミリ秒続いたら1文字にするか</label><input id="segMs" type="number" value="140" step="10" min="60"></div>
  <div class="field"><label><input id="handsFree" type="checkbox" style="width:auto;margin-right:8px">スペースなしでも入力する（キープ→閉口で確定）</label></div>
  <div class="field"><label for="holdMs">【スペースなし】何ミリ秒キープで準備完了にするか</label><input id="holdMs" type="number" value="180" step="20" min="60"></div>
  <div class="field"><label for="closeMs">【スペースなし】口を何ミリ秒閉じたら確定するか</label><input id="closeMs" type="number" value="80" step="20" min="40"></div>
  <div class="field"><label for="minConf">判定の確かさがこれ以上のときだけ使う（0〜1）</label><input id="minConf" type="number" value="0.45" step="0.05" min="0" max="1"></div>
  <div class="links">
    <button id="startTest">精度テスト（10問）<span>TEST</span></button>
    <button id="recalib">口形を登録し直す<span>CALIBRATE</span></button>
    <button id="clearLearn">前に使った文の記憶を消す<span>FORGET</span></button>
    <button id="exportLog">記録を書き出す<span>EXPORT</span></button>
  </div>
  <div class="note" id="testSummary"></div>
</aside>

<video id="video" playsinline muted></video>

<script type="text/plain" id="lexWorker">
// ステージ3: 母音の並びから言葉・文を推定する（ローカル）
// 辞書は IPADIC（kuromoji.js 用に配布されているもの）。語のコストと品詞のつながりコストを使い、
// かな漢字変換と同じ「ラティス＋最小コスト経路」で、母音だけを手がかりに変換する。
const VROWS = { a: 'アカサタナハマヤラワガザダバパァャヮ', i: 'イキシチニヒミリギジヂビピィヰ', u: 'ウクスツヌフムユルグズヅブプゥュヴ', e: 'エケセテネヘメレゲゼデベペェヱ', o: 'オコソトノホモヨロヲゴゾドボポォョ' };
const KV = {}; for (const v in VROWS) for (const k of VROWS[v]) KV[k] = v;
const SMALL = 'ャュョァィゥェォヮ';
const V2K = { a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お' };

// カタカナ/ひらがなの読み → 母音列（ん・っ は口の形に出ないので除く。ー は前の母音をのばす）
function vowelKey(kana) {
  let out = '';
  for (let ch of kana) {
    const c = ch.charCodeAt(0);
    if (c >= 0x3041 && c <= 0x3096) ch = String.fromCharCode(c + 0x60);
    if (ch === 'ン' || ch === 'ッ') continue;
    if (ch === 'ー') { if (out) out += out[out.length - 1]; continue; }
    const v = KV[ch];
    if (!v) return null;
    if (SMALL.includes(ch) && out) out = out.slice(0, -1) + v; else out += v;
  }
  return out;
}
// 母音列 → 連続をまとめたキーと、それぞれの回数  例: "oiia" → ["oia", [1,2,1]]
function rle(key) {
  let k = ''; const counts = [];
  for (const ch of key) { if (k && k[k.length - 1] === ch) counts[counts.length - 1]++; else { k += ch; counts.push(1); } }
  return [k, counts];
}

const PER_KEY = 80;        // 同じキーに対して残す語数
const MAX_SPAN = 8;        // 1語がまたぐ「母音のまとまり」の最大数
const PER_SPAN = 25;
const TAIL_COST = 3000;    // 変換できずに残した母音1つあたりのコスト
const LAMBDA = 3000;       // 長さの手がかりの重み
const EXPLICIT = 4000;     // 明示的に打ち分けた回数（閉口・押し直し）と合わない場合
const SUB_SCALE = 1500;
const FREQ_SCALE = 700;     // 頻度 → コスト（IPADIC のつながりコストと同じ尺度にそろえる）    // 母音の読み違いを仮定するコスト

function buildLexicon(tid, pos, cc, freq, onProgress) {
  const tv = new DataView(tid), pb = new Uint8Array(pos), dec = new TextDecoder();
  const index = new Map();
  const n = Math.floor(tid.byteLength / 10);
  for (let t = 0; t < n; t++) {
    const off = t * 10;
    const lid = tv.getInt16(off, true), rid = tv.getInt16(off + 2, true), cost = tv.getInt16(off + 4, true), p = tv.getInt32(off + 6, true);
    let e = p; while (pb[e] !== 0) e++;
    const f = dec.decode(pb.subarray(p, e)).split(',');
    if (f.length < 10) continue;

// ---------- 登録 ----------
let samples = [], collecting = null, calibrating = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
async function capture(c, round, label) {
  $('calibChar').textContent = KANA[c];
  $('calibMsg').textContent = HINT[c];
  $('calibStep').textContent = label;
  $('calibBar').style.transition = 'none'; $('calibBar').style.width = '0%';
  await sleep(900);                                  // 口の形を作る時間（この間のフレームは使わない）
  const t = performance.now();
  collecting = { c, round, from: t, until: t + 1100 };
  $('calibBar').style.transition = 'width 1.1s linear'; $('calibBar').style.width = '100%';
  await sleep(1150);
  collecting = null;
}
async function calibrate(onlyClass = null) {
  calibrating = true;
  $('calibVeil').classList.add('on'); $('calibRun').style.display = ''; $('calibDone').style.display = 'none';
  if (onlyClass) {
    samples = samples.filter(s => s.c !== onlyClass);
    for (let r = 0; r < 3; r++) await capture(onlyClass, r, `「${KANA[onlyClass]}」を撮り直し ${r + 1} / 3`);
  } else {
    samples = [];
    let n = 0;
    for (let r = 0; r < 3; r++) for (const c of shuffle(CLASSES)) await capture(c, r, `${++n} / ${CLASSES.length * 3}`);
  }
  model = fit(samples);
  const cv = crossValidate(samples);
  log.calibration = { at: new Date().toISOString(), n: samples.length, samples: samples.map(s => ({ c: s.c, round: s.round, f: s.f.map(v => +v.toFixed(4)) })) };
  log.cv = cv;
  showScores(cv);
}
function showScores(cv) {
  $('calibRun').style.display = 'none'; $('calibDone').style.display = 'block';
  const box = $('scores'); box.innerHTML = '';
  let worst = null;
  for (const c of CLASSES) {
    const a = cv.acc[c], pct = a == null ? '–' : Math.round(a * 100);
    const el = document.createElement('div');
    el.className = 'score ' + (a != null && a < 0.85 ? 'bad' : 'ok');
    el.innerHTML = `<span class="k">${KANA[c]}</span><b>${pct}<small>%</small></b>`;
    if (a != null && a < 0.85) { el.onclick = () => calibrate(c); if (!worst || a < cv.acc[worst]) worst = c; }
    box.appendChild(el);
  }
  if (worst) {
    const mix = Object.entries(cv.conf[worst] || {}).filter(([g]) => g !== worst).sort((p, q) => q[1] - p[1])[0];
    $('calibAdvice').textContent = mix ? `「${KANA[worst]}」が「${KANA[mix[0]]}」と混ざっています。${HINT[worst]}ように、はっきり作って撮り直すと良くなります。` : '';
  } else $('calibAdvice').textContent = 'どの口形もよく見分けられています。';
}
$('calibOk').onclick = () => { $('calibVeil').classList.remove('on'); calibrating = false; resetState(); };
$('calibAgain').onclick = () => calibrate();

// ---------- 入力の状態機械: キープで準備完了 → 閉じて確定 ----------
function setRing(p, isArmed) {
  const v = Math.max(0, Math.min(1, p));
  $('ringFg').setAttribute('stroke-dasharray', `${v * 100} 100`);
  $('ring').classList.toggle('empty', v === 0);
  $('ring').classList.toggle('armed', isArmed);
  $('panel').classList.toggle('armed', isArmed);
}
let ema = null, cand = null, since = 0, armed = null, closedSince = null;
// 押下中（スペース / ボタン）の状態
let rec = false, seg = null;
function idleHint() {
  $('hint').textContent = $('handsFree').checked ? 'スペースを押しながら口パク（押さずにキープ→閉口でも可）' : 'スペースを押しながら口パク。言葉が出たら離して選ぶ';
}
function resetState() { ema = null; cand = null; armed = null; closedSince = null; if (seg) { seg.run = null; seg.closed = true; } setRing(0, false); $('now').textContent = ''; if (!rec) idleHint(); }
function setRec(on) {
  if (on === rec) return;
  rec = on;
  $('holdBtn').classList.toggle('on', on); $('panel').classList.toggle('rec', on);
  if (on) {
    cand = null; armed = null;
    seg = { votes: {}, last: null, closed: true, run: null, runSince: 0, n: 0, any: false, tok: null, t0: performance.now() };
    $('hint').textContent = '入力中… 離すと終了';
  }
  else if (seg) {
    // 押している間に1文字も確定しなかったら、その間で一番多かった母音を1文字だけ入れる（短く押す使い方）
    if (!seg.any && seg.n >= 3) {
      const best = VOWELS.reduce((a, b) => (seg.votes[a] || 0) >= (seg.votes[b] || 0) ? a : b);
      if ((seg.votes[best] || 0) > seg.n * 0.25) commit(best, 'hold-release');
    }
    seg = null; setRing(0, false); $('now').textContent = ''; idleHint();
    learnSpeed(); refresh(); queryAI();
  }
}
function step(probs, unknown, now, f) {
  ema = ema ? Object.fromEntries(CLASSES.map(c => [c, ema[c] * 0.5 + probs[c] * 0.5])) : { ...probs };
  const best = CLASSES.reduce((a, b) => ema[a] >= ema[b] ? a : b);
  if (rec && seg) return stepRec(best, now, f);
  if (!$('handsFree').checked) { $('now').textContent = best === 'N' ? '' : KANA[best]; setRing(0, false); return; }
  // スペースなしモード: キープ → 閉口で確定（未知判定は使わず、確かさだけで判断）
  const label = ema[best] < num('minConf') ? null : best;
  if (label && label !== 'N') {
    closedSince = null;
    if (label !== cand) { cand = label; since = now; }
    if ((now - since) >= num('holdMs')) armed = label;
    setRing(armed === cand ? 1 : (now - since) / num('holdMs'), armed === cand);
    $('now').textContent = KANA[cand];
    $('hint').textContent = armed === cand ? '口を閉じると確定' : 'そのままキープ';
  } else if (label === 'N') {
    cand = null;
    closedSince = closedSince ?? now;
    if (armed && now - closedSince >= num('closeMs')) { commit(armed, 'camera'); armed = null; }
    if (!armed) { setRing(0, false); $('now').textContent = ''; idleHint(); }
  } else {
    cand = null;
    if (!armed) setRing(0, false);
  }
}
// 押下中: 同じ母音が segMs 続いたら即確定。同じ母音を続けるときは一度口を閉じる（または形を崩す）
function stepRec(best, now, f) {
  seg.n++;
  if (best !== 'N') seg.votes[best] = (seg.votes[best] || 0) + ema[best];
  if (best !== seg.run) { seg.run = best; seg.runSince = now; }
  const held = now - seg.runSince;
  if (best === 'N') {
    if (held >= 60) seg.closed = true;
    setRing(0, false); $('now').textContent = '';
    return;
  }
  const ok = ema[best] >= num('minConf');
  $('now').textContent = KANA[best];
  const fresh = best !== seg.last || seg.closed;
  if (!fresh) { if (seg.tok) seg.tok.ms = Math.round(now - seg.tok.t0); setRing(1, true); return; }   // 確定済みの母音を保持中（長さを測る）
  setRing(ok ? held / num('segMs') : 0, false);
  if (ok && held >= num('segMs')) {
    commit(best, 'hold', { ema, t0: seg.runSince }); seg.tok = tokens[tokens.length - 1]; seg.tok.ms = Math.round(held);
    seg.last = best; seg.closed = false; seg.any = true;
    setRing(1, true);
  }
}
function commit(v, via, info) {
  const t = { v, ms: 0, t0: info?.t0 ?? performance.now() };
  if (info?.ema) {
    // 判定が割れていたら、次点の母音を「読み違いかもしれない」候補として残す
    const alt = VOWELS.filter(x => x !== v).reduce((a, b) => info.ema[a] >= info.ema[b] ? a : b), p1 = info.ema[v], p2 = info.ema[alt];
    if (p2 > 0.12 && p1 < 0.8) { t.alt = alt; t.altCost = Math.round(Math.min(4000, 1500 * Math.log(p1 / p2)) + 500); }
  }
  tokens.push(t);
  log.commits.push({ t: Date.now(), v, via });
  if (test) testAnswer(v);
  refresh();
}

// ---------- ステージ3: 母音の並び → 言葉・文（ローカル辞書 ＋ AI） ----------
let committed = '', ctxRid = 0, consumedKey = '', tokens = [];
let runMs = store.get('runMs', null);            // この人のふだんの1文字の長さ
const history = [];
let phrases = store.get('phrases', []);          // 送信した文と、そのときの母音の並び（次から最優先で出す）
const median = xs => { const a = [...xs].sort((p, q) => p - q); return a[Math.floor(a.length / 2)]; };
const pendKana = () => tokens.map(t => KANA[t.v]).join('');
const collapse = k => k.replace(/(.)\1+/g, '$1');
// 観測のまとめ: 同じ母音を打ち分けたもの（閉口・押し直し）は e>=2、長めに保ったものは r が大きい
function getRuns() {
  const ms = tokens.map(t => t.ms).filter(x => x > 0);
  const ref = ms.length >= 3 ? median(ms) : runMs;
  const runs = [];
  for (const t of tokens) {
    const r = ref && t.ms > 0 ? +(t.ms / ref).toFixed(2) : 1;
    const last = runs[runs.length - 1];
    if (last && last.v === t.v) { last.e++; last.r = Math.max(last.r, r); delete last.alt; delete last.altCost; }
    else runs.push(t.alt ? { v: t.v, e: 1, r, alt: t.alt, altCost: t.altCost } : { v: t.v, e: 1, r });
  }
  return runs;
}
function renderTyped() {
  $('typed').textContent = committed; $('pend').textContent = pendKana();
  const len = committed.length + tokens.length;
  $('inputArea').classList.toggle('has', len > 0); $('inputArea').classList.toggle('long', len > 12);
}

// --- ローカル辞書（別スレッドで読み込み・変換） ---
let worker = null, dictReady = false, decodeId = 0, local = { words: [], sentences: [] };
const fitWaiters = new Map(); let fitId = 0;
function setDict(t) { $('dictNote').textContent = t; $('dictFoot').textContent = t; }
function startWorker() {
  try { worker = new Worker(URL.createObjectURL(new Blob([$('lexWorker').textContent], { type: 'text/javascript' }))); }
  catch { setDict('辞書: 使えません'); return; }
  worker.onmessage = ev => {
    const m = ev.data;
    if (m.type === 'progress') setDict('辞書: ' + m.text);
    else if (m.type === 'ready') { dictReady = true; setDict(`辞書: 準備OK（${m.words.toLocaleString()}語）`); refresh(); }
    else if (m.type === 'decoded') { if (m.id === decodeId && m.result) { local = m.result; renderCands(); } }
    else if (m.type === 'fitted') { fitWaiters.get(m.id)?.(m.ok); fitWaiters.delete(m.id); }
    else if (m.type === 'error') { if (!dictReady) setDict('辞書: 読み込めませんでした（' + m.text + '）'); }
  };
  const dev = location.hostname === 'localhost';
  setDict('辞書: 読み込み中（初回は約9MB）');
  worker.postMessage({ type: 'init',
    dict: dev ? location.origin + '/dict/' : 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/',
    freq: dev ? location.origin + '/dict/small_ja.msgpack.gz' : 'https://cdn.jsdelivr.net/gh/rspeer/wordfreq@master/wordfreq/data/small_ja.msgpack.gz' });
}
const fits = (yomis, runs) => new Promise(ok => {
  if (!worker) return ok(yomis.map(() => true));
  const id = ++fitId; fitWaiters.set(id, ok); worker.postMessage({ type: 'fits', id, yomis, runs });
  setTimeout(() => { if (fitWaiters.has(id)) { fitWaiters.delete(id); ok(yomis.map(() => true)); } }, 1500);
});

function refresh() {
  renderTyped();
  if (test) return;
  const runs = getRuns();
  if (!runs.length) { local = { words: [], sentences: [] }; decodeId++; }
  else if (dictReady) worker.postMessage({ type: 'decode', id: ++decodeId, runs, ctx: ctxRid });
  renderCands();
}

// --- 候補（右側） ---
const sig = () => committed + '|' + tokens.map(t => t.v).join('');
let ai = { sig: '', items: [], note: '' };
function chip(text, cls, onPick, tag) {
  const b = document.createElement('button'); b.className = 'cand ' + cls; b.textContent = text;
  if (tag) { const s = document.createElement('small'); s.textContent = tag; b.appendChild(s); }
  b.onclick = onPick; return b;
}
function section(box, en, jp, items) {
  if (!items.length) return;
  const h = document.createElement('div'); h.className = 'label sec'; h.innerHTML = `${en}<small>${jp}</small>`;
  box.appendChild(h); items.forEach(x => box.appendChild(x));
}
function renderCands() {
  const box = $('cands'); box.innerHTML = '';
  const runs = getRuns();
  if (!runs.length) { box.innerHTML = '<div class="empty">口パクすると、ここに言葉と文の候補が出ます。<br>出てきたらスペースを離して選ぶ。</div>'; return; }
  const key = runs.map(r => r.v).join('');
  const sents = [];
  if (!committed && key.length >= 2) {
    const hit = phrases.filter(p => p.key.startsWith(key)).sort((a, b) => (a.key.length - key.length) - (b.key.length - key.length)).slice(0, 3);
    for (const p of hit) sents.push(chip(p.text, 'sent', () => pickSentence(p.text, 'learned'), '前に使った'));
  }
  if (ai.sig === sig()) for (const it of ai.items) if (!sents.some(s => s.firstChild.textContent === it)) sents.push(chip(it, 'sent ai', () => pickSentence(it, 'ai'), 'AI'));
  section(box, 'SENTENCE', '文', sents);
  if (ai.note) { const n = document.createElement('div'); n.className = 'empty small'; n.textContent = ai.note; box.appendChild(n); }
  section(box, 'WORDS', '次の言葉', local.words.map(w => chip(w.text, 'word', () => pickWord(w))));
  if (!dictReady && !sents.length) { const n = document.createElement('div'); n.className = 'empty small'; n.textContent = $('dictNote').textContent; box.appendChild(n); }
}
function consume(nRuns, lastCount) {
  const runs = getRuns();
  for (let i = 0; i < nRuns && i < runs.length; i++) {
    const take = i === nRuns - 1 && lastCount && lastCount < runs[i].e ? lastCount : runs[i].e;
    consumedKey += runs[i].v; tokens.splice(0, take);
  }
}
function pickWord(w) {
  log.picks.push({ t: Date.now(), kind: 'word', text: w.text, runs: getRuns().slice(0, w.used) });
  consume(w.used, w.lastCount); committed += w.text; ctxRid = w.rid;
  refresh(); if (tokens.length) queryAI();
}
function pickSentence(text, src) {
  const runs = getRuns();
  log.picks.push({ t: Date.now(), kind: src, text, runs });
  consume(runs.length); committed += text; ctxRid = 0;
  refresh();
}
function learnSpeed() {
  const ms = tokens.map(t => t.ms).filter(x => x > 0);
  if (ms.length < 2) return;
  const m = median(ms); runMs = runMs ? runMs * 0.8 + m * 0.2 : m; store.set('runMs', Math.round(runMs));
}
function clearAll() { committed = ''; tokens = []; consumedKey = ''; ctxRid = 0; ai = { sig: '', items: [], note: '' }; refresh(); }
function send() {
  const text = committed + pendKana(); if (!text) return;
  const key = collapse(consumedKey + getRuns().map(r => r.v).join(''));
  if (committed && !tokens.length && key.length >= 2) {
    phrases = [{ text, key }, ...phrases.filter(p => p.text !== text)].slice(0, 200); store.set('phrases', phrases);
  }
  history.push({ text, t: Date.now() }); log.sent.push({ t: Date.now(), text, key });
  clearAll(); renderHistory();
}
function renderHistory() {
  const box = $('hist'); box.innerHTML = '';
  if (!history.length) { box.innerHTML = '<div class="empty">Enter で送ると、ここに下から積み上がります。</div>'; return; }
  for (const h of history.slice(-50)) {
    const d = document.createElement('div'); d.className = 'hb'; d.textContent = h.text;
    const tm = document.createElement('time'); tm.textContent = new Date(h.t).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }); d.appendChild(tm);
    box.appendChild(d);
  }
  box.scrollTop = box.scrollHeight;
}

// --- AI（Gemini）: 文脈から文を推定。答えは母音の並びと照合してから出す ---
let aiBusy = false, aiPending = false, aiLast = 0, aiPausedUntil = 0, aiTimer = 0;
function describeRuns(runs) {
  return runs.map((r, i) => {
    const hints = [];
    if (r.e >= 2) hints.push(`はっきり${r.e}回`);
    else if (r.r >= 2.4) hints.push('かなり長め（2〜3モーラ分の可能性が高い）');
    else if (r.r >= 1.6) hints.push('長め（2モーラ分の可能性が高い）');
    if (r.alt) hints.push(`「${KANA[r.alt]}」の見間違いかもしれない`);
    return `${i + 1}. ${KANA[r.v]}${hints.length ? '（' + hints.join('、') + '）' : ''}`;
  }).join('\n');
}
async function queryAI() {
  const key = $('gkey').value.trim(), runs = getRuns();
  if (!key || test || rec || runs.length < 2 || Date.now() < aiPausedUntil) return;
  if (aiBusy) { aiPending = true; return; }
  const wait = 2500 - (Date.now() - aiLast);
  if (wait > 0) { clearTimeout(aiTimer); aiTimer = setTimeout(queryAI, wait); return; }
  aiBusy = true; aiLast = Date.now(); const mySig = sig();
  ai = { sig: mySig, items: [], note: 'AI: 考え中…' }; renderCands();
  const prompt = `声を出さずに口パクで日本語を話した人の、口の形（母音）だけの観測から、何と言ったかを推定してください。
【観測のルール】
- 子音は見えません。「ん」「っ」も口の形に出ないので観測に含まれません。
- 観測は、口の形が変わるごとに1つです。同じ母音が続く部分（例: いい、きょう=おお、せんせい=ええ）は1つにまとまって見えることがあります。どの母音も1〜3モーラ分である可能性があり、「長め」と書かれたものはその可能性が高いです。
- 「はっきりN回」は、本人が同じ母音をN回に打ち分けたものです。
【これまでの会話（本人の発言）】
${history.slice(-3).map(h => '・' + h.text).join('\n') || '（なし）'}
【この発言で、すでに確定した部分】
「${committed}」
【その続きの観測（順番どおり）】
${describeRuns(runs)}
${local.words.length ? `【辞書による最初の言葉の候補（参考。正しいとは限らない）】\n${local.words.slice(0, 8).map(w => w.text).join('、')}` : ''}
【出力】
観測全体をちょうど使い切る、日常会話として自然な「続きの部分」を、確からしい順に最大5個。確定した部分は繰り返さないこと。
JSONのみ: {"candidates":[{"text":"漢字かな交じりの表記","yomi":"ひらがなの読み"}]}`;
  try {
    const models = ($('gmodel').value || '').split(',').map(s => s.trim()).filter(Boolean);
    let res = null, used = '';
    for (const model of models) {
      used = model;
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json', temperature: 0.3 } }),
      });
      if (res.status !== 404 && res.status !== 400) break;
    }
    if (!res) { ai.note = 'AI: モデル名が空です'; return; }
    if (res.status === 429) { aiPausedUntil = Date.now() + 60000; ai.note = 'AI: 無料枠の上限に当たったので1分休みます'; return; }
    if (!res.ok) { ai.note = `AI: エラー ${res.status}（${used}）`; return; }
    const j = await res.json();
    const text = (j.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    const list = (JSON.parse(text.replace(/^```(json)?|```$/g, '').trim()).candidates || []).filter(c => c && c.text && c.yomi);
    const ok = await fits(list.map(c => c.yomi), runs);
    log.ai.push({ t: Date.now(), model: used, runs, list, ok });
    if (sig() !== mySig) return;
    const items = [...new Set(list.filter((c, i) => ok[i]).map(c => String(c.text)))].slice(0, 5);
    ai = { sig: mySig, items, note: items.length ? '' : 'AI: 母音の並びに合う文が見つかりませんでした' };
  } catch (e) { ai.note = 'AI: ' + String(e.message || e).slice(0, 60); }
  finally { aiBusy = false; if (ai.sig === sig()) renderCands(); if (aiPending) { aiPending = false; queryAI(); } }
}

// ---------- 精度テスト: お題の母音を10問 ----------
let test = null;
function nextQuestion() {
  if (test.i >= test.qs.length) {
    const ok = test.results.filter(r => r.ok).length, secs = test.results.reduce((a, r) => a + r.ms, 0) / test.results.length / 1000;
    const summary = `正答 ${ok} / ${test.results.length}（${Math.round(ok / test.results.length * 100)}%）、1文字あたり ${secs.toFixed(1)} 秒`;
    log.tests.push({ at: new Date().toISOString(), results: test.results, summary });
    $('target').textContent = 'テスト結果: ' + summary; $('testSummary').textContent = '前回のテスト: ' + summary;
    test = null; return;
  }
  test.shownAt = performance.now();
  $('target').innerHTML = `TEST ${test.i + 1} / ${test.qs.length}　<b>「${KANA[test.qs[test.i]]}」</b> を打ってください`;
}
function testAnswer(v) {
  test.results.push({ want: test.qs[test.i], got: v, ok: v === test.qs[test.i], ms: Math.round(performance.now() - test.shownAt) });
  test.i++; nextQuestion();
}
$('startTest').onclick = () => {
  drawer(false);
  const qs = []; for (let k = 0; k < 2; k++) qs.push(...shuffle(VOWELS));
  test = { qs, i: 0, results: [] }; clearAll(); nextQuestion();
};

// ---------- メインループ ----------
let lastFrame = 0;
function loop() {
  requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2) return;
  const now = performance.now();
  if (now - lastFrame < 30) return;
  lastFrame = now;
  const res = landmarker.detectForVideo(video, now);
  updateCrop(res);
  drawMouth(calibrating ? $('calibCanvas') : $('mouthCanvas'));
  const f = features(res, video.videoWidth, video.videoHeight);
  if (!f) { if (!calibrating) { resetState(); $('hint').textContent = '顔が見えません。カメラの正面へ'; } return; }
  if (collecting && now >= collecting.from && now <= collecting.until) samples.push({ c: collecting.c, round: collecting.round, f });
  if (!calibrating && model) { const r = predict(model, f); step(r.probs, r.unknown, now, f); }
}

idleHint(); renderTyped(); renderCands(); renderHistory(); startWorker();
$('clearLearn').onclick = () => { phrases = []; store.set('phrases', []); drawer(false); renderCands(); };
// 自動テスト用の入口（カメラなしで判定結果を流し込む）
window.__kpTest = { setModel: m => { model = m; }, step, setRec, get typed() { return committed + pendKana(); }, get runs() { return getRuns(); } };

// ---------- 開始 ----------
$('startCam').onclick = async () => {
  $('startCam').disabled = true; $('startCam').textContent = '準備しています…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' } });
    video.srcObject = stream; await video.play();
    const v = '0.10.14';
    const { FaceLandmarker, FilesetResolver } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${v}`);
    const fs = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${v}/wasm`);
    landmarker = await FaceLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true,
    });
    $('startBox').style.display = 'none';
    requestAnimationFrame(loop);
    await calibrate();   // 登録は必ず行う
  } catch (e) {
    $('startCam').disabled = false; $('startCam').textContent = 'カメラをはじめる';
    $('hint').textContent = 'カメラを使えませんでした: ' + (e.message || e);
  }
};

// ---------- 設定 ----------
const drawer = on => { $('settingsVeil').classList.toggle('on', on); $('scrim').classList.toggle('on', on); };
$('openSettings').onclick = () => drawer(true);
$('closeSettings').onclick = $('scrim').onclick = () => drawer(false);
$('recalib').onclick = () => { drawer(false); if (landmarker) calibrate(); };

renderTyped();
</script>
</body>
</html>
