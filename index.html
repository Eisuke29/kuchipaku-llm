<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>口パク入力</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --surface-2: #efeee9; --ink: #1c1c1a; --mute: #6f6e69; --line: #e2e0d9;
    --acc: #3a4fd6; --acc-ink: #ffffff; --acc-soft: #e7eafc; --ok: #1d8a52; --warn: #b4641c;
    --radius: 18px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1e1e1c; --surface-2: #2a2a27; --ink: #efeee9; --mute: #a19f98; --line: #34332f;
      --acc: #8296ff; --acc-ink: #10131f; --acc-soft: #252a45; --ok: #52c98a; --warn: #e3a15f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); }
  .pill { font-size: 12px; color: var(--mute); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50vw; }
  .spacer { flex: 1; }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
  .icon-btn svg { width: 18px; height: 18px; }

  .app { max-width: 1080px; margin: 0 auto; padding: 8px 20px 40px; display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }

  .convo { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-height: 240px; }
  .label { font-size: 11.5px; color: var(--mute); margin: 0 0 4px 6px; letter-spacing: .04em; }
  .them { align-self: flex-start; width: min(82%, 520px); }
  .them textarea { width: 100%; resize: none; border: none; outline: none; background: var(--surface-2); color: var(--ink); border-radius: 18px 18px 18px 6px; padding: 12px 16px; font: inherit; font-size: 16px; line-height: 1.55; field-sizing: content; min-height: 48px; }
  .them textarea::placeholder { color: var(--mute); }
  .me { align-self: flex-end; max-width: 92%; min-width: 55%; }
  .me .label { text-align: right; margin: 0 6px 4px 0; }
  .bubble-me { background: var(--acc); color: var(--acc-ink); border-radius: 18px 18px 6px 18px; padding: 14px 18px; font-size: 22px; line-height: 1.6; min-height: 60px; word-break: break-all; }
  .bubble-me .ph { opacity: .65; font-size: 15px; }
  .caret { display: inline-block; width: 2px; height: 1.05em; background: currentColor; vertical-align: -0.15em; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .tokens { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; min-height: 30px; }
  .tok { font-size: 14px; padding: 4px 9px; border-radius: 10px; background: var(--acc-soft); border: 1px dashed color-mix(in srgb, var(--acc) 45%, transparent); }
  .tok small { color: var(--mute); margin-left: 3px; font-size: 11px; }
  .tok.closed { background: transparent; color: var(--mute); }

  .status { font-size: 13px; color: var(--mute); min-height: 20px; margin: 12px 2px; display: flex; align-items: center; gap: 8px; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--acc); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .cand { position: relative; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px 12px 40px; min-height: 64px; transition: transform .08s, border-color .15s; box-shadow: var(--shadow); }
  .cand:hover { border-color: var(--acc); }
  .cand:active { transform: scale(.98); }
  .cand .n { position: absolute; left: 12px; top: 13px; width: 20px; height: 20px; border-radius: 6px; background: var(--surface-2); color: var(--mute); font-size: 12px; display: grid; place-items: center; }
  .cand .t { font-size: 19px; font-weight: 500; display: block; }
  .cand .r { font-size: 12px; color: var(--mute); display: block; margin-top: 2px; }
  .cand.match { border-color: var(--ok); }
  .cand.match .n { background: var(--ok); color: #fff; }
  .cand.match .r::after { content: "口形一致"; margin-left: 6px; color: var(--ok); font-weight: 500; }

  .side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 70px; }
  @media (max-width: 900px) { .side { position: static; } }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .mouth { position: relative; aspect-ratio: 2 / 1; border-radius: 14px; overflow: hidden; background: #0d0d0c; }
  .mouth canvas { width: 100%; height: 100%; display: block; }
  .mouth .empty { position: absolute; inset: 0; display: grid; place-items: center; color: #9a988f; font-size: 13px; text-align: center; padding: 16px; line-height: 1.6; }
  .readout { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--mute); }
  .readout b { font-size: 22px; color: var(--ink); min-width: 1.2em; }
  .meter { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--acc); transition: width .1s; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 14px; font-size: 14px; }
  .btn:hover { border-color: var(--acc); }
  .btn.primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.grow { flex: 1; }
  .note { font-size: 12px; color: var(--mute); line-height: 1.6; margin-top: 10px; }
  .pad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .pad button { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; font-weight: 500; }
  .pad button:active { background: var(--acc-soft); }
  .actions { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--mute); list-style: none; display: flex; align-items: center; gap: 6px; }
  details summary::before { content: "▸"; transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  .hist { font-size: 12px; color: var(--mute); line-height: 1.7; max-height: 140px; overflow: auto; }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 92vw); background: var(--surface); z-index: 21; transform: translateX(100%); transition: transform .25s ease; padding: 20px; overflow: auto; visibility: hidden; }
  .drawer.on { transform: none; visibility: visible; box-shadow: -8px 0 30px rgba(0,0,0,.15); }
  .drawer h2 { font-size: 17px; margin: 4px 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--mute); margin-bottom: 6px; }
  .field input, .field select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 14px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; margin-bottom: 12px; line-height: 1.5; }
  .check input { margin-top: 3px; }
  .warn { font-size: 12px; color: var(--warn); line-height: 1.6; }

  .modal { position: fixed; inset: 0; display: none; place-items: center; z-index: 30; background: rgba(10,10,12,.72); backdrop-filter: blur(6px); padding: 20px; }
  .modal.on { display: grid; }
  .calib { width: min(520px, 100%); background: var(--surface); border-radius: 24px; padding: 24px; text-align: center; box-shadow: var(--shadow); }
  .calib .big { font-size: 88px; font-weight: 700; line-height: 1.1; margin: 4px 0; color: var(--acc); }
  .calib .msg { font-size: 15px; color: var(--mute); min-height: 24px; }
  .calib .mouth { margin: 16px 0 8px; }
  .prog { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin: 12px 0 6px; }
  .prog > div { height: 100%; width: 0; background: var(--acc); }
  .steps { font-size: 12px; color: var(--mute); }

  video#video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="dot"></span>口パク入力</div>
  <span class="pill" id="llmPill">LLM未設定</span>
  <div class="spacer"></div>
  <button class="icon-btn" id="openSettings" aria-label="設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
  </button>
</header>

<main class="app">
  <div>
    <section class="convo">
      <div class="them">
        <div class="label">相手のメッセージ（任意・返信の文脈に使います）</div>
        <textarea id="partner" rows="1" placeholder="例: 明日の飲み会、来れる？"></textarea>
      </div>
      <div class="me">
        <div class="label">あなた</div>
        <div class="bubble-me"><span id="composedText"></span><span class="caret"></span></div>
      </div>
      <div class="tokens" id="tokens"></div>
    </section>
    <div class="status" id="status"></div>
    <div class="cands" id="cands"></div>
  </div>

  <aside class="side">
    <div class="card cam-card">
      <div class="mouth">
        <canvas id="mouthCanvas" width="480" height="240"></canvas>
        <div class="empty" id="mouthEmpty">カメラを開始すると、口元だけを自動で追いかけて表示します</div>
      </div>
      <div class="readout"><span>認識</span><b id="live">–</b><div class="meter"><div id="conf"></div></div></div>
      <div class="row">
        <button class="btn primary grow" id="startCam">カメラを開始</button>
        <button class="btn" id="openCalib" disabled>口形を登録</button>
      </div>
      <div class="note" id="camMsg">登録しなくても既定の判定で使えます。精度を上げたいときは「口形を登録」してください。</div>
    </div>

    <div class="card act-card">
      <div class="actions">
        <button class="btn primary" id="convert">変換</button>
        <button class="btn" id="undo">戻す</button>
        <button class="btn" id="copy">コピー</button>
      </div>
      <div class="row"><button class="btn grow" id="clearAll">全部消す</button></div>
      <details style="margin-top:14px">
        <summary>カメラなしで試す（母音キー）</summary>
        <div class="pad" id="pad" style="margin-top:10px"></div>
        <div class="note">キーボードの a i u e o n でも入力できます。Enterで変換、数字キーで候補を選択、Backspaceで戻す。</div>
      </details>
      <details style="margin-top:10px">
        <summary>確定の履歴</summary>
        <div class="hist" id="history" style="margin-top:8px"></div>
      </details>
    </div>
  </aside>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="設定">
  <h2>設定</h2>
  <div class="field">
    <label for="backend">候補を出すLLM</label>
    <select id="backend"></select>
  </div>
  <div id="geminiBox">
    <div class="field">
      <label for="gkey">Gemini APIキー（このブラウザにだけ保存されます）</label>
      <input id="gkey" type="password" placeholder="AIza...">
    </div>
    <div class="field">
      <label for="gmodel">モデル</label>
      <input id="gmodel" type="text" value="gemini-2.5-flash">
    </div>
    <div class="field">
      <label for="gfallback">上限に当たったときの予備モデル</label>
      <input id="gfallback" type="text" value="gemini-2.5-flash-lite">
    </div>
    <label class="check"><input type="checkbox" id="think"> じっくり考えさせる（精度は上がるが遅くなる）</label>
    <p class="warn">無料枠に送った内容はGoogleの製品改善に使われます。実験では有料枠かローカルLLMを使ってください。</p>
  </div>
  <label class="check"><input type="checkbox" id="retry" checked> 口形が合う候補がないとき、1回だけ推定し直す</label>
  <div class="field">
    <label for="endMs">唇を閉じてこの時間止まったら変換（ms）</label>
    <input id="endMs" type="number" value="700" step="50">
  </div>
  <div class="field">
    <label for="minSeg">これより短い口形は無視（ms）</label>
    <input id="minSeg" type="number" value="80" step="10">
  </div>
  <div class="field">
    <label for="unitMs">1モーラの長さの目安（ms）</label>
    <input id="unitMs" type="number" value="150" step="10">
  </div>
  <div class="row"><button class="btn" id="clearCalib">口形の登録を消去</button><button class="btn primary" id="closeSettings">閉じる</button></div>
</aside>

<div class="modal" id="calibModal" role="dialog" aria-label="口形の登録">
  <div class="calib">
    <div class="steps" id="calibStep"></div>
    <div class="big" id="calibChar">あ</div>
    <div class="msg" id="calibMsg"></div>
    <div class="prog"><div id="calibProg"></div></div>
    <div class="mouth"><canvas id="calibCanvas" width="480" height="240"></canvas></div>
    <div class="row" style="justify-content:center"><button class="btn" id="calibCancel">やめる</button></div>
  </div>
</div>

<video id="video" playsinline muted></video>

<script src="core.js"></script>
<script type="module">
const $ = id => document.getElementById(id);
const CLASSES = ['a', 'i', 'u', 'e', 'o', 'N'];
const LABEL = { a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お', N: '閉' };
const HINT = { a: '口を縦に大きく開ける', i: '口を横に引く', u: '唇をすぼめて前に出す', e: '口を横に開き、少し縦にも開ける', o: '唇を丸く開ける', N: '唇を軽く閉じる（「ん」）' };
const store = {
  get(k, d) { try { const v = localStorage.getItem('kp_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('kp_' + k, JSON.stringify(v)); } catch {} },
};

// ---------- 状態と描画 ----------
let tokens = [], committed = [], pending = null, lastQueryKey = '';
function render() {
  const text = committed.join('');
  if (text) $('composedText').textContent = text;
  else $('composedText').innerHTML = '<span class="ph">口パクで話すと、ここに文ができます</span>';
  $('tokens').innerHTML = tokens.map(t => `<span class="tok${t.v === 'N' ? ' closed' : ''}">${LABEL[t.v]}${t.alt ? `<small>/${LABEL[t.alt]}</small>` : ''}<small>${Math.round(t.ms)}</small></span>`).join('');
}
function setStatus(s, busy = false) {
  $('status').innerHTML = busy ? '<span class="spinner"></span><span></span>' : '<span></span>';
  $('status').lastChild.textContent = s;
}

// ---------- 設定 ----------
const openDrawer = on => { $('drawer').classList.toggle('on', on); $('scrim').classList.toggle('on', on); };
$('openSettings').onclick = () => openDrawer(true);
$('closeSettings').onclick = $('scrim').onclick = () => openDrawer(false);
for (const id of ['gkey', 'gmodel', 'gfallback', 'endMs', 'minSeg', 'unitMs']) { const v = store.get(id, null); if (v != null) $(id).value = v; $(id).onchange = () => { store.set(id, $(id).value.trim()); updatePill(); }; }
for (const id of ['think', 'retry']) { const v = store.get(id, null); if (v != null) $(id).checked = v; $(id).onchange = () => store.set(id, $(id).checked); }
$('partner').value = store.get('partner', '');
$('partner').oninput = () => store.set('partner', $('partner').value);
const unitMs = () => Number($('unitMs').value) || 150;

// ---------- LLM ----------
let claudeSample = null, usedModel = '';
const backendSel = $('backend');
function refreshBackends() {
  const opts = [];
  if (claudeSample) opts.push(['claude', 'Claude（このページ上・キー不要）']);
  opts.push(['gemini', 'Gemini API']);
  const cur = backendSel.value || store.get('backend', '');
  backendSel.innerHTML = opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
  backendSel.value = opts.some(o => o[0] === cur) ? cur : opts[0][0];
  $('geminiBox').style.display = backendSel.value === 'gemini' ? '' : 'none';
  updatePill();
}
function updatePill() {
  const p = $('llmPill');
  if (backendSel.value === 'claude') p.textContent = 'Claude';
  else p.textContent = $('gkey').value.trim() ? `Gemini · ${usedModel || $('gmodel').value}` : 'Gemini APIキー未設定';
}
backendSel.onchange = () => { store.set('backend', backendSel.value); refreshBackends(); };
refreshBackends();
(async () => {
  try { if (window.claude && typeof window.claude.use === 'function') { claudeSample = await window.claude.use('sample'); refreshBackends(); } } catch {}
})();

async function geminiOnce(model, prompt, signal, withThinking) {
  const gen = { responseMimeType: 'application/json', temperature: 0.4 };
  if (withThinking) gen.thinkingConfig = { thinkingBudget: $('think').checked ? -1 : 0 };
  return fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent($('gkey').value.trim())}`, {
    method: 'POST', signal, headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: gen }),
  });
}
async function askGemini(prompt, signal) {
  if (!$('gkey').value.trim()) throw new Error('右上の設定からGemini APIキーを入れてください');
  const models = [$('gmodel').value.trim() || 'gemini-2.5-flash', $('gfallback').value.trim()].filter(Boolean);
  let lastErr = '';
  for (const model of models) {
    let res = await geminiOnce(model, prompt, signal, true);
    if (res.status === 400) res = await geminiOnce(model, prompt, signal, false);
    if (res.ok) {
      const j = await res.json();
      usedModel = model; updatePill();
      return (j.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    }
    lastErr = `Gemini ${res.status}: ${(await res.text()).slice(0, 160)}`;
    if (res.status !== 429 && res.status !== 503) break;
  }
  throw new Error(lastErr);
}
async function askClaude(prompt, signal) { return (await claudeSample(prompt, { modelTier: 'quick', signal, cache: false })).text; }

async function convert() {
  if (!tokens.some(t => t.v !== 'N')) return;
  const key = JSON.stringify(tokens) + '|' + committed.join('');
  if (key === lastQueryKey && $('cands').children.length) return;
  lastQueryKey = key;
  if (pending) pending.abort();
  const ctrl = new AbortController(); pending = ctrl;
  const snap = tokens.slice();
  const ask = p => backendSel.value === 'claude' ? askClaude(p, ctrl.signal) : askGemini(p, ctrl.signal);
  const ctx = [committed.join(''), $('partner').value.trim()];
  setStatus('候補を考えています', true);
  const t0 = performance.now();
  const took = () => `${((performance.now() - t0) / 1000).toFixed(1)}秒`;
  try {
    const cands = KP.parseCandidates(await ask(KP.buildPrompt(snap, ...ctx)));
    if (ctrl.signal.aborted) return;
    let ranked = KP.rank(snap, cands, unitMs());
    showCands(ranked, snap.length);
    if ($('retry').checked && ranked.length && !ranked.some(c => c.dist === 0)) {
      setStatus('口形が合う候補がないので、推定し直しています', true);
      const more = KP.parseCandidates(await ask(KP.buildPrompt(snap, ...ctx, KP.feedbackFor(ranked))));
      if (ctrl.signal.aborted) return;
      ranked = KP.rank(snap, [...more, ...cands], unitMs());
      showCands(ranked, snap.length);
    }
    setStatus(ranked.length ? `${ranked.length}件・${took()}　タップか数字キーで確定` : '候補を読み取れませんでした。もう一度「変換」を押してください');
  } catch (e) {
    if (ctrl.signal.aborted) return;
    if (e && e.code === 'not_granted') setStatus('Claudeの利用が許可されていません');
    else if (e && e.code === 'rate_limited') setStatus('呼び出しが多すぎます。少し待ってください');
    else setStatus(e.message || String(e));
  } finally { if (pending === ctrl) pending = null; }
}
function showCands(list, used) {
  const box = $('cands'); box.innerHTML = '';
  list.slice(0, 9).forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'cand' + (c.dist === 0 ? ' match' : '');
    b.title = `口形: ${KP.visemeString(c.reading || '')}`;
    b.innerHTML = '<span class="n"></span><span class="t"></span><span class="r"></span>';
    b.querySelector('.n').textContent = i + 1;
    b.querySelector('.t').textContent = c.text;
    b.querySelector('.r').textContent = c.reading || '';
    b.onclick = () => pick(c, used);
    box.appendChild(b);
  });
}
function pick(c, used) {
  committed.push(c.text);
  const h = document.createElement('div');
  h.textContent = `${KP.tokensToText(tokens.slice(0, used))} → ${c.text}`;
  $('history').prepend(h);
  tokens = tokens.slice(used); lastQueryKey = '';
  $('cands').innerHTML = ''; setStatus('');
  render();
  if (tokens.some(t => t.v !== 'N')) convert();
}
function addToken(v, ms, alt) {
  const last = tokens[tokens.length - 1];
  if (last && last.v === v) { last.ms += ms; last.alt = last.alt || alt; } else tokens.push({ v, ms, alt });
  lastQueryKey = ''; render();
}
$('convert').onclick = convert;
$('undo').onclick = () => { if (tokens.length) tokens.pop(); else committed.pop(); $('cands').innerHTML = ''; lastQueryKey = ''; setStatus(''); render(); };
$('clearAll').onclick = () => { tokens = []; committed = []; $('cands').innerHTML = ''; $('history').innerHTML = ''; setStatus(''); render(); };
$('copy').onclick = async () => { try { await navigator.clipboard.writeText(committed.join('')); setStatus('コピーしました'); } catch { setStatus('コピーできませんでした'); } };

CLASSES.forEach(v => { const b = document.createElement('button'); b.textContent = LABEL[v]; b.onclick = () => addToken(v, 150); $('pad').appendChild(b); });
document.addEventListener('keydown', e => {
  if (e.target.matches('textarea, input, select')) return;
  const map = { a: 'a', i: 'i', u: 'u', e: 'e', o: 'o', n: 'N' };
  const k = e.key.toLowerCase();
  if (map[k]) { addToken(map[k], 150); e.preventDefault(); }
  else if (e.key === 'Enter') { convert(); e.preventDefault(); }
  else if (e.key === 'Backspace') { $('undo').click(); e.preventDefault(); }
  else if (/^[1-9]$/.test(e.key)) { const b = $('cands').children[Number(e.key) - 1]; if (b) b.click(); }
});

// ---------- カメラ・口元フレーミング・口形認識 ----------
// MediaPipe Face Landmarker（学習済みの顔モデル）が出す口のブレンドシェイプと唇の寸法を特徴量にする
const BS = ['jawOpen', 'mouthClose', 'mouthFunnel', 'mouthPucker', 'mouthStretchLeft', 'mouthStretchRight', 'mouthSmileLeft', 'mouthSmileRight',
  'mouthLowerDownLeft', 'mouthLowerDownRight', 'mouthUpperUpLeft', 'mouthUpperUpRight', 'mouthRollLower', 'mouthRollUpper', 'mouthPressLeft', 'mouthPressRight'];
const LIPS = [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185];
let samples = store.get('samples', []);
let landmarker = null, collecting = null;
const video = $('video');
const crop = { x: 0, y: 0, w: 0, h: 0, ok: false };

function features(res) {
  const lm = res.faceLandmarks?.[0], bs = res.faceBlendshapes?.[0]?.categories;
  if (!lm || !bs) return null;
  const d = (p, q) => Math.hypot(lm[p].x - lm[q].x, lm[p].y - lm[q].y);
  const face = d(234, 454) || 1;
  const s = {}; for (const c of bs) s[c.categoryName] = c.score;
  return { vec: [...BS.map(n => s[n] || 0), d(13, 14) / face * 3, d(61, 291) / face * 2], bs: s, gap: d(13, 14) / face, width: d(61, 291) / face };
}

// 登録なしで使う既定の判定: ブレンドシェイプからの経験則（仮の値。登録すると個人の口形に置き換わる）
let widthRef = null;   // 本人の普段の口幅（閉じているときに更新）
function defaultClassify(F) {
  const s = F.bs, avg = (a, b) => ((s[a] || 0) + (s[b] || 0)) / 2;
  const jaw = s.jawOpen || 0, pucker = s.mouthPucker || 0, funnel = s.mouthFunnel || 0;
  const spread = Math.max(avg('mouthStretchLeft', 'mouthStretchRight'), avg('mouthSmileLeft', 'mouthSmileRight'));
  const open = Math.max(jaw, F.gap * 2.2);
  if (widthRef == null) widthRef = F.width;
  const wRel = F.width / widthRef;   // 1より大きい=横に引いている、小さい=すぼめている
  const score = {
    N: 1.2 - open * 6 - funnel * 2,
    a: open * 3 - pucker * 2 - Math.max(0, wRel - 1.08) * 4,
    i: (wRel - 1) * 6 + spread * 2 - open * 2.5 - pucker * 2,
    u: pucker * 3 + (1 - wRel) * 5 - open * 2,
    e: open * 1.6 + (wRel - 1) * 4 + spread * 1.2 - pucker * 2 - Math.max(0, open - 0.35) * 4,
    o: funnel * 3 + pucker * 1 + open * 1.2 + (1 - wRel) * 3 - spread * 2,
  };
  if (open < 0.06 && pucker < 0.3) widthRef = widthRef * 0.98 + F.width * 0.02;
  const ex = {}; let tot = 0; for (const c of CLASSES) { ex[c] = Math.exp(score[c] * 2); tot += ex[c]; }
  const probs = {}; for (const c of CLASSES) probs[c] = ex[c] / tot;
  const best = Object.entries(probs).sort((a, b) => b[1] - a[1])[0];
  return { c: best[0], p: best[1], probs };
}
function knnClassify(f) {
  const ds = samples.map(s => ({ c: s.c, d: s.f.reduce((a, x, i) => a + (x - f[i]) ** 2, 0) })).sort((a, b) => a.d - b.d).slice(0, 7);
  const votes = {}; ds.forEach(x => votes[x.c] = (votes[x.c] || 0) + 1 / (1e-4 + x.d));
  const total = Object.values(votes).reduce((a, b) => a + b, 0);
  const probs = {}; CLASSES.forEach(c => probs[c] = (votes[c] || 0) / total);
  const best = Object.entries(probs).sort((a, b) => b[1] - a[1])[0];
  return { c: best[0], p: best[1], probs };
}
const registeredAll = () => CLASSES.every(c => samples.some(s => s.c === c));
const classify = F => registeredAll() ? knnClassify(F.vec) : defaultClassify(F);

// 唇のランドマークから切り抜き枠を決め、なめらかに追従させる
function updateCrop(res) {
  const lm = res.faceLandmarks?.[0];
  if (!lm) return;
  const W = video.videoWidth, H = video.videoHeight;
  let x0 = 1, x1 = 0, ya = 1, yb = 0;
  for (const i of LIPS) { const p = lm[i]; x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); ya = Math.min(ya, p.y); yb = Math.max(yb, p.y); }
  const cx = (x0 + x1) / 2 * W, cy = (ya + yb) / 2 * H;
  const faceW = Math.hypot((lm[454].x - lm[234].x) * W, (lm[454].y - lm[234].y) * H);
  const w = Math.max((x1 - x0) * W * 1.7, faceW * 0.6), h = w / 2;   // 2:1。顔幅を基準にして口の開閉で枠が跳ねないようにする
  const k = crop.ok ? 0.25 : 1;
  crop.x += ((cx - w / 2) - crop.x) * k; crop.y += ((cy - h / 2) - crop.y) * k;
  crop.w += (w - crop.w) * k; crop.h += (h - crop.h) * k; crop.ok = true;
}
// 口元だけをグレースケールで描く（ほかには何も描かない）
function drawMouth(canvas) {
  if (!crop.ok) return;
  const g = canvas.getContext('2d');
  g.save();
  g.filter = 'grayscale(1) contrast(1.1)';
  g.translate(canvas.width, 0); g.scale(-1, 1);
  g.drawImage(video, crop.x, crop.y, crop.w, crop.h, 0, 0, canvas.width, canvas.height);
  g.restore();
}

// 連続分節
let hist = [], runLabel = null, runStart = 0, closedSince = null, lastFrame = 0, runProbs = {}, runFrames = 0;
function runAlt(label) {
  if (!runFrames) return undefined;
  const alt = Object.entries(runProbs).filter(([c]) => c !== label).sort((a, b) => b[1] - a[1])[0];
  return alt && alt[1] / runFrames >= 0.25 ? alt[0] : undefined;
}
function onFrameLabel(label, now, probs) {
  hist.push(label); if (hist.length > 5) hist.shift();
  const cnt = {}; hist.forEach(l => cnt[l] = (cnt[l] || 0) + 1);
  const smooth = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
  if (smooth !== runLabel) {
    if (runLabel !== null) {
      const ms = now - runStart;
      if (ms >= Number($('minSeg').value || 80) && !(runLabel === 'N' && !tokens.length)) addToken(runLabel, ms, runLabel === 'N' ? undefined : runAlt(runLabel));
    }
    runLabel = smooth; runStart = now; runProbs = {}; runFrames = 0;
  }
  for (const c in probs) runProbs[c] = (runProbs[c] || 0) + probs[c];
  runFrames++;
  if (smooth === 'N') {
    closedSince = closedSince ?? now;
    if (tokens.some(t => t.v !== 'N') && now - closedSince > Number($('endMs').value || 700)) {
      while (tokens.length && tokens[tokens.length - 1].v === 'N') tokens.pop();
      closedSince = Infinity; render(); convert();
    }
  } else closedSince = null;
}

function loop() {
  requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2) return;
  const now = performance.now();
  if (now - lastFrame >= 30) {
    lastFrame = now;
    const res = landmarker.detectForVideo(video, now);
    updateCrop(res);
    const F = features(res);
    if (!F) { $('live').textContent = '–'; }
    else {
      if (collecting && now > collecting.from && now < collecting.until) samples.push({ c: collecting.c, f: F.vec });
      const r = classify(F);
      $('live').textContent = LABEL[r.c];
      $('conf').style.width = Math.round(r.p * 100) + '%';
      if (!collecting) onFrameLabel(r.c, now, r.probs);
    }
  }
  drawMouth($('mouthCanvas'));
  if ($('calibModal').classList.contains('on')) drawMouth($('calibCanvas'));
}

// ガイド付き口形登録: 6口形×3周、各口形0.7秒準備＋1.2秒収集
const sleep = ms => new Promise(r => setTimeout(r, ms));
let calibAbort = false;
async function runCalibration() {
  if (!landmarker) return;
  calibAbort = false;
  $('calibModal').classList.add('on');
  const seq = []; for (let round = 0; round < 3; round++) seq.push(...CLASSES);
  for (let i = 0; i < seq.length && !calibAbort; i++) {
    const c = seq[i];
    $('calibStep').textContent = `${i + 1} / ${seq.length}`;
    $('calibChar').textContent = LABEL[c];
    $('calibMsg').textContent = `${HINT[c]}。そのままキープ`;
    $('calibProg').style.transition = 'none'; $('calibProg').style.width = '0%';
    await sleep(700);
    if (calibAbort) break;
    const t = performance.now();
    collecting = { c, from: t, until: t + 1200 };
    $('calibProg').style.transition = 'width 1.2s linear'; $('calibProg').style.width = '100%';
    await sleep(1250);
    collecting = null;
  }
  collecting = null;
  store.set('samples', samples.slice(-1500));
  $('calibModal').classList.remove('on');
  $('camMsg').textContent = calibAbort ? '登録を中断しました。' : '登録できました。あなたの口形で判定しています。';
}
$('openCalib').onclick = runCalibration;
$('calibCancel').onclick = () => { calibAbort = true; };
$('clearCalib').onclick = () => { samples = []; store.set('samples', []); $('camMsg').textContent = '登録を消去しました。既定の判定に戻ります。'; };

$('startCam').onclick = async () => {
  $('startCam').disabled = true;
  $('camMsg').textContent = 'カメラと顔認識モデルを準備しています…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' } });
    video.srcObject = stream; await video.play();
    const v = '0.10.14';
    const { FaceLandmarker, FilesetResolver } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${v}`);
    const fs = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${v}/wasm`);
    landmarker = await FaceLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true,
    });
    $('mouthEmpty').style.display = 'none';
    $('startCam').textContent = 'カメラ動作中';
    $('openCalib').disabled = false;
    $('camMsg').textContent = registeredAll()
      ? '登録済みのあなたの口形で判定しています。'
      : '既定の判定で動いています。まず唇を軽く閉じて1秒ほど待ってから話してください。精度を上げるなら「口形を登録」。';
    requestAnimationFrame(loop);
  } catch (e) {
    $('startCam').disabled = false;
    $('camMsg').textContent = 'カメラを使えません（claude.ai上のページではカメラが使えません。GitHub Pages版で開いてください）。母音キーで試せます。詳細: ' + (e.message || e);
  }
};

render();
</script>
</body>
