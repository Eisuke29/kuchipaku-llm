<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くちぱく</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
  :root {
    --sky-top: #bcdcff; --sky-bottom: #f3f8ff; --cloud: #ffffff; --ink: #34405a; --mute: #8592ad;
    --acc: #6f8cff; --ok: #4cb88a; --warn: #f0a35e; --shadow: 0 18px 50px rgba(90, 130, 210, .18), 0 2px 8px rgba(90, 130, 210, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --sky-top: #1d2747; --sky-bottom: #39466f; --cloud: #eef2fb; --ink: #2b3550; --mute: #7a86a3; --shadow: 0 18px 50px rgba(0,0,0,.35); }
    .state .hint, .foot, .target { color: #c9d3ee !important; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom)) fixed; min-height: 100vh; overflow-x: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }

  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .puff { position: absolute; background: rgba(255,255,255,.55); border-radius: 50%; filter: blur(2px); animation: drift 60s linear infinite; }
  .puff::before, .puff::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .puff::before { width: 70%; height: 70%; left: 45%; top: -30%; }
  .puff::after { width: 55%; height: 55%; left: -20%; top: 10%; }
  @keyframes drift { from { transform: translateX(-10vw); } to { transform: translateX(110vw); } }
  @media (prefers-reduced-motion: reduce) { .puff { animation: none; } }

  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; display: flex; flex-direction: column; align-items: center; }
  .top { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
  .logo { font-weight: 700; font-size: 18px; color: #fff; text-shadow: 0 2px 10px rgba(80,120,200,.35); letter-spacing: .08em; }
  .gear { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: var(--shadow); display: grid; place-items: center; }
  .gear svg { width: 20px; height: 20px; color: var(--mute); }

  .cloud { position: relative; isolation: isolate; width: 100%; background: var(--cloud); border-radius: 64px; padding: 44px 56px; min-height: 170px; box-shadow: var(--shadow); display: flex; align-items: center; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: var(--cloud); border-radius: 50%; z-index: -1; }
  .cloud::before { width: 180px; height: 180px; top: -62px; left: 14%; }
  .cloud::after { width: 130px; height: 130px; top: -40px; left: 48%; }
  .bump { position: absolute; background: var(--cloud); border-radius: 50%; z-index: -1; }
  .text { font-size: clamp(34px, 7vw, 60px); font-weight: 500; letter-spacing: .08em; line-height: 1.35; word-break: break-all; min-height: 1.35em; }
  .caret { display: inline-block; width: 3px; height: 1em; border-radius: 2px; background: var(--acc); vertical-align: -0.1em; margin-left: 4px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .clear { position: absolute; right: 22px; top: 18px; width: 34px; height: 34px; border-radius: 50%; color: var(--mute); font-size: 20px; display: none; }
  .clear:hover { background: #eef2fb; }
  .cloud.has .clear { display: grid; place-items: center; }
  .dots { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 14px 0 10px; }
  .dots span { display: block; border-radius: 50%; background: var(--cloud); box-shadow: var(--shadow); }

  .mouth-wrap { position: relative; width: min(420px, 100%); aspect-ratio: 2 / 1; }
  .mouth { position: absolute; inset: 0; border-radius: 999px; overflow: hidden; background: #2a3045; box-shadow: var(--shadow); }
  .mouth canvas { width: 100%; height: 100%; display: block; }
  .ring { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); pointer-events: none; overflow: visible; }
  .ring rect { fill: none; stroke-width: 6; stroke-linecap: round; }
  .ring .bg { stroke: rgba(255,255,255,.7); }
  .ring .fg { stroke: var(--acc); transition: stroke .15s; }
  .ring.empty .fg { opacity: 0; }
  .ring.armed .fg { stroke: var(--ok); }
  .start { position: absolute; inset: 0; display: grid; place-items: center; }
  .pill-btn { background: var(--cloud); color: var(--ink); border-radius: 999px; padding: 14px 28px; font-size: 16px; font-weight: 700; box-shadow: var(--shadow); }
  .pill-btn.sub { background: #f1f4fb; font-weight: 500; }
  .pill-btn:disabled { opacity: .5; }
  .state { margin-top: 18px; text-align: center; min-height: 64px; }
  .state .now { font-size: 40px; font-weight: 700; line-height: 1.1; color: var(--acc); min-height: 44px; }
  .state .hint { font-size: 14px; color: #5f6f96; margin-top: 6px; }
  .foot { margin-top: 22px; font-size: 13px; color: #7d8bb0; text-align: center; line-height: 1.8; }

  .veil { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(140, 175, 235, .45); backdrop-filter: blur(10px); }
  .veil.on { display: flex; }
  .card { position: relative; width: min(560px, 100%); max-height: 92vh; overflow: auto; background: var(--cloud); border-radius: 44px; padding: 32px; box-shadow: var(--shadow); text-align: center; }
  .card h2 { margin: 0 0 6px; font-size: 20px; }
  .card p { color: var(--mute); font-size: 14px; line-height: 1.8; margin: 6px 0; }
  .big { font-size: 96px; font-weight: 700; color: var(--acc); line-height: 1.1; margin: 8px 0 2px; }
  .bar { height: 10px; border-radius: 5px; background: #e8edf8; overflow: hidden; margin: 14px 0; }
  .bar > div { height: 100%; width: 0; background: var(--acc); border-radius: 5px; }
  .card .mouth-wrap { margin: 16px auto; width: min(320px, 100%); }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .row .pill-btn { box-shadow: 0 4px 14px rgba(90,130,210,.18); }
  .row .pill-btn.primary { background: var(--acc); color: #fff; }
  .scores { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 16px 0 8px; }
  .score { border-radius: 22px; padding: 10px 4px; background: #f1f4fb; }
  .score b { display: block; font-size: 26px; }
  .score span { font-size: 13px; color: var(--mute); }
  .score.ok b { color: var(--ok); } .score.bad b { color: var(--warn); }
  .score.bad { outline: 2px solid var(--warn); cursor: pointer; }
  .field { text-align: left; margin: 14px 0; }
  .field label { display: block; font-size: 13px; color: var(--mute); margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 16px; border-radius: 999px; border: 2px solid #e8edf8; font: inherit; color: var(--ink); background: #f7f9fe; }
  .close-x { position: absolute; right: 18px; top: 16px; width: 36px; height: 36px; border-radius: 50%; color: var(--mute); font-size: 20px; }
  .target { font-size: 15px; color: #4d5c85; margin-bottom: 10px; min-height: 24px; text-align: center; }
  .target b { font-size: 22px; }

  video#video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="puff" style="width:220px;height:90px;top:12%;animation-duration:90s;animation-delay:-20s"></div>
  <div class="puff" style="width:160px;height:64px;top:38%;animation-duration:120s;animation-delay:-70s"></div>
  <div class="puff" style="width:260px;height:100px;top:70%;animation-duration:100s;animation-delay:-45s"></div>
</div>

<div class="wrap">
  <div class="top">
    <div class="logo">くちぱく</div>
    <button class="gear" id="openSettings" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg></button>
  </div>

  <div class="target" id="target"></div>

  <div class="cloud" id="cloud">
    <span class="bump" style="width:110px;height:110px;bottom:-30px;left:8%"></span>
    <span class="bump" style="width:150px;height:150px;bottom:-50px;right:12%"></span>
    <div class="text"><span id="typed"></span><span class="caret"></span></div>
    <button class="clear" id="clear" aria-label="全部消す">×</button>
  </div>

  <div class="dots" aria-hidden="true"><span style="width:26px;height:26px"></span><span style="width:16px;height:16px"></span></div>

  <div class="mouth-wrap">
    <div class="mouth"><canvas id="mouthCanvas" width="480" height="240"></canvas></div>
    <svg class="ring empty" id="ring" viewBox="0 0 434 224" preserveAspectRatio="none"><rect class="bg" x="3" y="3" width="428" height="218" rx="109"/><rect class="fg" id="ringFg" x="3" y="3" width="428" height="218" rx="109" pathLength="100" stroke-dasharray="0 100"/></svg>
    <div class="start" id="startBox"><button class="pill-btn" id="startCam">カメラをはじめる</button></div>
  </div>

  <div class="state">
    <div class="now" id="now"></div>
    <div class="hint" id="hint">口の形をキープ → 口を閉じる で1文字</div>
  </div>

  <div class="foot">Backspace で全部けす</div>
</div>

<div class="veil" id="calibVeil">
  <div class="card">
    <div id="calibRun">
      <p id="calibStep"></p>
      <div class="big" id="calibChar">あ</div>
      <p id="calibMsg"></p>
      <div class="bar"><div id="calibBar"></div></div>
      <div class="mouth-wrap"><div class="mouth"><canvas id="calibCanvas" width="480" height="240"></canvas></div></div>
      <p>声は出さず、使うときと同じ口パクで。</p>
    </div>
    <div id="calibDone" style="display:none">
      <h2>登録できました</h2>
      <p>登録した口形で判定したときの正答率です（周ごとの交差検証）。<br>オレンジの母音は押すと撮り直せます。</p>
      <div class="scores" id="scores"></div>
      <p id="calibAdvice"></p>
      <div class="row">
        <button class="pill-btn sub" id="calibAgain">ぜんぶ撮り直す</button>
        <button class="pill-btn primary" id="calibOk">はじめる</button>
      </div>
    </div>
  </div>
</div>

<div class="veil" id="settingsVeil">
  <div class="card">
    <button class="close-x" id="closeSettings" aria-label="閉じる">×</button>
    <h2>設定</h2>
    <div class="field"><label for="holdMs">母音を何ミリ秒キープしたら準備完了にするか</label><input id="holdMs" type="number" value="300" step="50" min="100"></div>
    <div class="field"><label for="closeMs">口を何ミリ秒閉じたら確定するか</label><input id="closeMs" type="number" value="120" step="20" min="40"></div>
    <div class="field"><label for="minConf">判定の確かさがこれ以上のときだけ使う（0〜1）</label><input id="minConf" type="number" value="0.6" step="0.05" min="0" max="1"></div>
    <div class="row">
      <button class="pill-btn sub" id="recalib">口形を登録し直す</button>
      <button class="pill-btn sub" id="startTest">精度テスト（10問）</button>
      <button class="pill-btn sub" id="exportLog">記録を書き出す</button>
    </div>
    <p id="testSummary"></p>
  </div>
</div>

<video id="video" playsinline muted></video>

<script type="module">
const $ = id => document.getElementById(id);
const CLASSES = ['a', 'i', 'u', 'e', 'o', 'N'];
const VOWELS = ['a', 'i', 'u', 'e', 'o'];
const KANA = { a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お', N: '閉' };
const HINT = {
  a: '口を縦に大きく開ける', i: '口を横に引く', u: '唇をすぼめて前に突き出す',
  e: '口を横に開き、少しだけ縦にも開ける', o: '唇を丸くして縦に開ける', N: '唇を軽く閉じる',
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('kp1_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('kp1_' + k, JSON.stringify(v)); } catch {} },
};
for (const id of ['holdMs', 'closeMs', 'minConf']) { const v = store.get(id, null); if (v != null) $(id).value = v; $(id).onchange = () => store.set(id, $(id).value); }
const num = id => Number($(id).value);

// ---------- 記録（あとで解析・学習に使う） ----------
const log = { startedAt: new Date().toISOString(), userAgent: navigator.userAgent, calibration: null, cv: null, commits: [], tests: [] };
$('exportLog').onclick = () => {
  const blob = new Blob([JSON.stringify(log)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `kuchipaku-log-${Date.now()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

// ---------- 入力欄 ----------
let typed = '';
function renderTyped() { $('typed').textContent = typed; $('cloud').classList.toggle('has', typed.length > 0); }
function clearAll() { typed = ''; renderTyped(); }
$('clear').onclick = clearAll;
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.key === 'Backspace') { clearAll(); e.preventDefault(); }
  else if (!landmarker && VOWELS.includes(e.key)) commit(e.key, 'key');   // カメラなしの動作確認用
});

// ---------- 特徴量: 顔に固定した座標系での唇の形 ----------
// 頭の向き・カメラとの距離の影響を取り除くため、両頬と額・顎から顔の座標系を作り、その中で測る
const INNER = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];
const OUTER = [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 375, 321, 405, 314, 17, 84, 181, 91, 146];
const BS = ['jawOpen', 'mouthClose', 'mouthFunnel', 'mouthPucker', 'mouthRollLower', 'mouthRollUpper', 'mouthShrugLower', 'mouthShrugUpper'];
const BS_PAIRS = [['mouthStretchLeft', 'mouthStretchRight'], ['mouthSmileLeft', 'mouthSmileRight'], ['mouthLowerDownLeft', 'mouthLowerDownRight'],
  ['mouthUpperUpLeft', 'mouthUpperUpRight'], ['mouthPressLeft', 'mouthPressRight'], ['mouthDimpleLeft', 'mouthDimpleRight']];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

function features(res, W, H) {
  const lm = res.faceLandmarks?.[0], bs = res.faceBlendshapes?.[0]?.categories;
  if (!lm || !bs) return null;
  const P = i => [lm[i].x * W, lm[i].y * H, lm[i].z * W];
  const L = P(234), R = P(454), Top = P(10), Chin = P(152);
  const ex = norm(sub(R, L));
  const up0 = sub(Top, Chin);
  const ey = norm(sub(up0, ex.map(v => v * dot(up0, ex))));
  const ez = cross(ex, ey);
  const o = [(L[0] + R[0]) / 2, (L[1] + R[1]) / 2, (L[2] + R[2]) / 2];
  const s = Math.hypot(...sub(R, L)) || 1;
  const loc = i => { const d = sub(P(i), o); return [dot(d, ex) / s, dot(d, ey) / s, dot(d, ez) / s]; };
  const d2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const inner = INNER.map(loc);
  let area = 0;
  for (let k = 0; k < inner.length; k++) { const p = inner[k], q = inner[(k + 1) % inner.length]; area += p[0] * q[1] - q[0] * p[1]; }
  area = Math.abs(area) / 2;
  const l13 = loc(13), l14 = loc(14), l78 = loc(78), l308 = loc(308), l0 = loc(0), l17 = loc(17), l61 = loc(61), l291 = loc(291), l1 = loc(1), l152 = loc(152);
  const ih = d2(l13, l14), iw = d2(l78, l308), oh = d2(l0, l17), ow = d2(l61, l291);
  const centerZ = (l0[2] + l13[2] + l14[2] + l17[2]) / 4, cornerZ = (l61[2] + l291[2]) / 2;
  const cornerY = (l61[1] + l291[1]) / 2 - (l13[1] + l14[1]) / 2;
  const sc = {}; for (const c of bs) sc[c.categoryName] = c.score;
  const geo = [
    area * 40,                      // 口腔の面積
    ih / (iw + 0.02) * 2,           // 口腔の縦横比
    ih * 8, iw * 4, oh * 5, ow * 3, // 内側・外側の高さと幅
    (centerZ - cornerZ) * 20,       // 唇中央の突き出し（う・お）
    d2(l0, l13) * 15, d2(l14, l17) * 15, // 上下の唇の厚み（巻き込み）
    cornerY * 15,                   // 口角の上がり（い・え）
    d2(l1, l152) * 3,               // 鼻先と顎の距離（顎の開き）
  ];
  const blend = [...BS.map(n => sc[n] || 0), ...BS_PAIRS.map(([a, b]) => ((sc[a] || 0) + (sc[b] || 0)) / 2)];
  return [...geo, ...blend];
}

// ---------- 分類: 本人データで標準化したk近傍法 ----------
let model = null;
function dist2(a, b) { let s = 0; for (let j = 0; j < a.length; j++) s += (a[j] - b[j]) ** 2; return s; }
function fit(samples) {
  const n = samples.length, dim = samples[0].f.length;
  const mean = Array(dim).fill(0), std = Array(dim).fill(0);
  for (const s of samples) s.f.forEach((v, j) => mean[j] += v / n);
  for (const s of samples) s.f.forEach((v, j) => std[j] += (v - mean[j]) ** 2 / n);
  for (let j = 0; j < dim; j++) std[j] = Math.max(Math.sqrt(std[j]), 1e-3);
  const X = samples.map(s => s.f.map((v, j) => (v - mean[j]) / std[j]));
  const y = samples.map(s => s.c);
  // どの登録データからも遠い形を「不明」とするしきい値: 登録データ同士の最近傍距離の95%点の2倍
  const nn = X.map((a, i) => { let best = Infinity; X.forEach((b, k) => { if (k !== i) { const d = dist2(a, b); if (d < best) best = d; } }); return Math.sqrt(best); }).sort((p, q) => p - q);
  return { mean, std, X, y, rejectDist: (nn[Math.floor(nn.length * 0.95)] || 1) * 2 };
}
function predict(m, f, K = 7) {
  const z = f.map((v, j) => (v - m.mean[j]) / m.std[j]);
  const ds = m.X.map((x, i) => ({ d: dist2(z, x), c: m.y[i] })).sort((p, q) => p.d - q.d).slice(0, K);
  const votes = {}; let tot = 0;
  for (const { d, c } of ds) { const w = 1 / (Math.sqrt(d) + 0.05); votes[c] = (votes[c] || 0) + w; tot += w; }
  const probs = {}; for (const c of CLASSES) probs[c] = (votes[c] || 0) / tot;
  return { probs, unknown: Math.sqrt(ds[0].d) > m.rejectDist };
}
// 周ごとの交差検証: ある周を抜いて残りで学習し、抜いた周を判定する
function crossValidate(samples) {
  const rounds = [...new Set(samples.map(s => s.round))];
  const hit = {}, all = {}, conf = {};
  for (const r of rounds) {
    const train = samples.filter(s => s.round !== r), test = samples.filter(s => s.round === r);
    if (!train.length || !test.length) continue;
    const m = fit(train);
    for (const s of test) {
      const p = predict(m, s.f).probs, guess = CLASSES.reduce((a, b) => p[a] >= p[b] ? a : b);
      all[s.c] = (all[s.c] || 0) + 1; if (guess === s.c) hit[s.c] = (hit[s.c] || 0) + 1;
      conf[s.c] = conf[s.c] || {}; conf[s.c][guess] = (conf[s.c][guess] || 0) + 1;
    }
  }
  const acc = {}; for (const c of CLASSES) acc[c] = all[c] ? (hit[c] || 0) / all[c] : null;
  return { acc, conf };
}

// ---------- カメラと口元の切り抜き ----------
const video = $('video');
let landmarker = null;
const crop = { x: 0, y: 0, w: 0, h: 0, ok: false };
function updateCrop(res) {
  const lm = res.faceLandmarks?.[0]; if (!lm) return;
  const W = video.videoWidth, H = video.videoHeight;
  let x0 = 1, x1 = 0, ya = 1, yb = 0;
  for (const i of OUTER) { const p = lm[i]; x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); ya = Math.min(ya, p.y); yb = Math.max(yb, p.y); }
  const cx = (x0 + x1) / 2 * W, cy = (ya + yb) / 2 * H;
  const faceW = Math.hypot((lm[454].x - lm[234].x) * W, (lm[454].y - lm[234].y) * H);
  const w = faceW * 0.75, h = w / 2;
  const k = crop.ok ? 0.25 : 1;
  crop.x += ((cx - w / 2) - crop.x) * k; crop.y += ((cy - h / 2) - crop.y) * k;
  crop.w += (w - crop.w) * k; crop.h += (h - crop.h) * k; crop.ok = true;
}
function drawMouth(canvas) {
  if (!crop.ok) return;
  const g = canvas.getContext('2d');
  g.save(); g.filter = 'grayscale(1) contrast(1.08)';
  g.translate(canvas.width, 0); g.scale(-1, 1);
  g.drawImage(video, crop.x, crop.y, crop.w, crop.h, 0, 0, canvas.width, canvas.height);
  g.restore();
}

// ---------- 登録 ----------
let samples = [], collecting = null, calibrating = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
async function capture(c, round, label) {
  $('calibChar').textContent = KANA[c];
  $('calibMsg').textContent = HINT[c];
  $('calibStep').textContent = label;
  $('calibBar').style.transition = 'none'; $('calibBar').style.width = '0%';
  await sleep(900);                                  // 口の形を作る時間（この間のフレームは使わない）
  const t = performance.now();
  collecting = { c, round, from: t, until: t + 1100 };
  $('calibBar').style.transition = 'width 1.1s linear'; $('calibBar').style.width = '100%';
  await sleep(1150);
  collecting = null;
}
async function calibrate(onlyClass = null) {
  calibrating = true;
  $('calibVeil').classList.add('on'); $('calibRun').style.display = ''; $('calibDone').style.display = 'none';
  if (onlyClass) {
    samples = samples.filter(s => s.c !== onlyClass);
    for (let r = 0; r < 3; r++) await capture(onlyClass, r, `「${KANA[onlyClass]}」を撮り直し ${r + 1} / 3`);
  } else {
    samples = [];
    let n = 0;
    for (let r = 0; r < 3; r++) for (const c of shuffle(CLASSES)) await capture(c, r, `${++n} / ${CLASSES.length * 3}`);
  }
  model = fit(samples);
  const cv = crossValidate(samples);
  log.calibration = { at: new Date().toISOString(), n: samples.length, samples: samples.map(s => ({ c: s.c, round: s.round, f: s.f.map(v => +v.toFixed(4)) })) };
  log.cv = cv;
  showScores(cv);
}
function showScores(cv) {
  $('calibRun').style.display = 'none'; $('calibDone').style.display = '';
  const box = $('scores'); box.innerHTML = '';
  let worst = null;
  for (const c of CLASSES) {
    const a = cv.acc[c], pct = a == null ? '–' : Math.round(a * 100);
    const el = document.createElement('div');
    el.className = 'score ' + (a != null && a < 0.85 ? 'bad' : 'ok');
    el.innerHTML = `<span>${KANA[c]}</span><b>${pct}</b><span>%</span>`;
    if (a != null && a < 0.85) { el.onclick = () => calibrate(c); if (!worst || a < cv.acc[worst]) worst = c; }
    box.appendChild(el);
  }
  if (worst) {
    const mix = Object.entries(cv.conf[worst] || {}).filter(([g]) => g !== worst).sort((p, q) => q[1] - p[1])[0];
    $('calibAdvice').textContent = mix ? `「${KANA[worst]}」が「${KANA[mix[0]]}」と混ざっています。${HINT[worst]}ように、はっきり作って撮り直すと良くなります。` : '';
  } else $('calibAdvice').textContent = 'どの口形もよく見分けられています。';
}
$('calibOk').onclick = () => { $('calibVeil').classList.remove('on'); calibrating = false; resetState(); };
$('calibAgain').onclick = () => calibrate();

// ---------- 入力の状態機械: キープで準備完了 → 閉じて確定 ----------
let ema = null, cand = null, since = 0, armed = null, closedSince = null;
function resetState() { ema = null; cand = null; armed = null; closedSince = null; setRing(0, false); $('now').textContent = ''; }
function setRing(p, isArmed) {
  const v = Math.max(0, Math.min(1, p));
  $('ringFg').setAttribute('stroke-dasharray', `${v * 100} 100`);
  $('ring').classList.toggle('empty', v === 0);
  $('ring').classList.toggle('armed', isArmed);
}
function step(probs, unknown, now) {
  ema = ema ? Object.fromEntries(CLASSES.map(c => [c, ema[c] * 0.5 + probs[c] * 0.5])) : { ...probs };
  const best = CLASSES.reduce((a, b) => ema[a] >= ema[b] ? a : b);
  const label = unknown || ema[best] < num('minConf') ? null : best;
  if (label && label !== 'N') {
    closedSince = null;
    if (label !== cand) { cand = label; since = now; }
    if ((now - since) >= num('holdMs')) armed = label;
    setRing(armed === cand ? 1 : (now - since) / num('holdMs'), armed === cand);
    $('now').textContent = KANA[cand];
    $('hint').textContent = armed === cand ? '口を閉じると確定' : 'そのままキープ';
  } else if (label === 'N') {
    cand = null;
    closedSince = closedSince ?? now;
    if (armed && now - closedSince >= num('closeMs')) { commit(armed, 'camera'); armed = null; }
    if (!armed) { setRing(0, false); $('now').textContent = ''; $('hint').textContent = '口の形をキープ → 口を閉じる で1文字'; }
  } else {
    cand = null;   // 形の移り変わり中など。準備完了の母音は保持する
    if (!armed) setRing(0, false);
  }
}
function commit(v, via) {
  typed += KANA[v]; renderTyped();
  log.commits.push({ t: Date.now(), v, via });
  if (test) testAnswer(v);
}

// ---------- 精度テスト: お題の母音を10問 ----------
let test = null;
function nextQuestion() {
  if (test.i >= test.qs.length) {
    const ok = test.results.filter(r => r.ok).length, secs = test.results.reduce((a, r) => a + r.ms, 0) / test.results.length / 1000;
    const summary = `正答 ${ok} / ${test.results.length}（${Math.round(ok / test.results.length * 100)}%）、1文字あたり ${secs.toFixed(1)} 秒`;
    log.tests.push({ at: new Date().toISOString(), results: test.results, summary });
    $('target').textContent = 'テスト結果: ' + summary; $('testSummary').textContent = '前回のテスト: ' + summary;
    test = null; return;
  }
  test.shownAt = performance.now();
  $('target').innerHTML = `テスト ${test.i + 1} / ${test.qs.length}　<b>「${KANA[test.qs[test.i]]}」</b> を打ってください`;
}
function testAnswer(v) {
  test.results.push({ want: test.qs[test.i], got: v, ok: v === test.qs[test.i], ms: Math.round(performance.now() - test.shownAt) });
  test.i++; nextQuestion();
}
$('startTest').onclick = () => {
  $('settingsVeil').classList.remove('on');
  const qs = []; for (let k = 0; k < 2; k++) qs.push(...shuffle(VOWELS));
  test = { qs, i: 0, results: [] }; clearAll(); nextQuestion();
};

// ---------- メインループ ----------
let lastFrame = 0;
function loop() {
  requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2) return;
  const now = performance.now();
  if (now - lastFrame < 30) return;
  lastFrame = now;
  const res = landmarker.detectForVideo(video, now);
  updateCrop(res);
  drawMouth(calibrating ? $('calibCanvas') : $('mouthCanvas'));
  const f = features(res, video.videoWidth, video.videoHeight);
  if (!f) { if (!calibrating) { $('hint').textContent = '顔が見えません。カメラの正面へ'; resetState(); } return; }
  if (collecting && now >= collecting.from && now <= collecting.until) samples.push({ c: collecting.c, round: collecting.round, f });
  if (!calibrating && model) { const r = predict(model, f); step(r.probs, r.unknown, now); }
}

// ---------- 開始 ----------
$('startCam').onclick = async () => {
  $('startCam').disabled = true; $('startCam').textContent = '準備しています…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' } });
    video.srcObject = stream; await video.play();
    const v = '0.10.14';
    const { FaceLandmarker, FilesetResolver } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${v}`);
    const fs = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${v}/wasm`);
    landmarker = await FaceLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true,
    });
    $('startBox').style.display = 'none';
    requestAnimationFrame(loop);
    await calibrate();   // 登録は必ず行う
  } catch (e) {
    $('startCam').disabled = false; $('startCam').textContent = 'カメラをはじめる';
    $('hint').textContent = 'カメラを使えませんでした: ' + (e.message || e);
  }
};

// ---------- 設定 ----------
$('openSettings').onclick = () => $('settingsVeil').classList.add('on');
$('closeSettings').onclick = () => $('settingsVeil').classList.remove('on');
$('recalib').onclick = () => { $('settingsVeil').classList.remove('on'); if (landmarker) calibrate(); };

renderTyped();
</script>
</body>
</html>
